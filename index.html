akan sistem Chronos dan Web Flight Plan (WFP) AirNav untuk menjaga On-Time Performance (OTP).`,`Membangun kepercayaan dengan UPBU, UPTD, agen perjalanan lokal, otoritas pelabuhan, BUMN, TNI/POLRI, dan pemerintah daerah hingga kontrak penerbangan perintis 2024 tuntas dan berlanjut ke 2025.`],en:[`Served as airline representative at Tardamu Airport (Sabu Raijua, NTT), leading a 4-person ground handling team to optimize ground time and training airport interns.`,`Managed head-office ground handling operations at Nusawiru Airport (Cijulang, West Java), leading a 3-person team, coordinating hangar mechanics and Pertamina refueling, and mentoring new field staff.`,`Handled and marshalled Cessna Grand Caravan (C208B), Pilatus Porter (PC-6), Cessna 172 Skyhawk (C172S), and Piaggio Avanti (P180) aircraft with daily flight reporting and external coordination.`,`Assigned to fleet readiness and maintenance support for the "Sumatra Humanitarian Mission 2025", handling baggage/cargo loading, Avtur & Avgas drum inventory, and crew refueling procedures.`,`Managed slot times and flight plans for Regular, Pioneer, MEDEVAC, Charter, Training, and Corporate flights via Chronos and AirNav Web Flight Plan (WFP) to sustain high On-Time Performance (OTP).`,`Built strong institutional coordination with UPBU, UPTD, port authorities, BUMN, TNI/POLRI, and local government—completing the 2024 pioneer contract and securing continuation into 2025.`]},systemsAndTools:[`Cessna C208B · Pilatus PC-6 · Cessna C172S · Piaggio P180`,`Chronos Flight System`,`AirNav Web Flight Plan (WFP)`,`Avtur & Avgas Fuel Inventory`,`UPBU / UPTD / TNI-POLRI Liaison`],keyOutcome:{id:`Menuntaskan kontrak penerbangan perintis 2024 hingga berlanjut di 2025 serta mendukung langsung misi kemanusiaan Sumatra 2025 dengan OTP tinggi.`,en:`Completed the 2024 pioneer flight contract into 2025 renewal and directly supported the 2025 Sumatra Humanitarian Mission with high OTP.`},featured:!0},{id:`polindo-exim`,category:`exim`,categoryLabel:{id:`EXIM & Pelatihan`,en:`EXIM & Training`},period:`2026`,location:`Surabaya`,organization:`Polindo Surabaya`,role:{id:`Peserta Pelatihan & Sertifikasi EXIM (Ekspor-Impor)`,en:`EXIM (Export-Import) Training & Certification`},summary:{id:`Menguasai alur transaksi perdagangan internasional, penyusunan dokumen kepabeanan (Invoice, Packing List, B/L, AWB, COO/SKA, PEB, PIB), Incoterms 2020, serta kalkulasi biaya ekspor-impor.`,en:`Trained and certified in international trade workflows, export-import customs documents (Commercial Invoice, Packing List, B/L, AWB, COO/SKA, PEB, PIB), Incoterms 2020, and freight/duty cost calculation.`},highlights:{id:[`Mempelajari konsep perdagangan internasional dan peran eksportir, importir, supplier, buyer, hingga freight forwarder dari persiapan transaksi sampai pengiriman ke negara tujuan.`,`Menguasai jenis dan fungsi dokumen ekspor-impor: Commercial Invoice, Packing List, Bill of Lading (B/L), Air Waybill (AWB), Certificate of Origin (COO/SKA), PEB, dan PIB serta regulasi kepabeanan.`,`Memahami penerapan Incoterms 2020 (EXW, FOB, CFR, CIF) terkait pembagian tanggung jawab, biaya, dan risiko antara penjual dan pembeli pada pengiriman laut maupun udara.`,`Menguasai perhitungan dasar biaya ekspor-impor meliputi biaya freight, bea kepabeanan, bea masuk (import duty), pajak impor, dan biaya logistik lainnya.`],en:[`Mastered international trade fundamentals and roles across exporters, importers, suppliers, buyers, and freight forwarders from contract prep to destination delivery.`,`Prepared and analyzed core trade documents: Commercial Invoice, Packing List, Bill of Lading (B/L), Air Waybill (AWB), Certificate of Origin (COO/SKA), PEB, and PIB under customs regulations.`,`Applied Incoterms 2020 (EXW, FOB, CFR, CIF) covering cost, risk, and responsibility allocation across sea freight and air freight distribution.`,`Calculated end-to-end EXIM landed costs including freight charges, customs fees, import duties, import taxes, and logistics expenses.`]},systemsAndTools:[`Commercial Invoice & Packing List`,`HS Code Classification`,`B/L & AWB`,`COO / SKA · PEB · PIB`,`Incoterms 2020 (EXW, FOB, CFR, CIF)`],keyOutcome:{id:`Tersertifikasi resmi Polindo Program EXIM dan Kompetensi Penyiapan Dokumen Ekspor BNSP.`,en:`Awarded Polindo EXIM Training Certificate and BNSP Export Document Preparation Competency.`},featured:!0},{id:`plafonesia-warehouse`,category:`exim`,categoryLabel:{id:`Gudang & QC`,en:`Warehouse & QC`},period:`2026`,location:`Surabaya`,organization:`Plafonesia`,role:{id:`Warehouse Staff & Produksi QC`,en:`Warehouse Staff & Production QC`},summary:{id:`Verifikasi barang masuk berbasis PO, pencatatan stok & stock opname berkala, operasional mesin produksi sesuai SOP, inspeksi Quality Control, serta menjaga target produksi >95% dengan nol kecelakaan kerja.`,en:`Handled PO-based inbound verification, inventory books & stock opname, SOP machine operation, and finished-goods QC—consistently exceeding 95% production targets with zero safety incidents.`},highlights:{id:[`Menerima dan memverifikasi jumlah serta jenis barang dari supplier berdasarkan Purchase Order (PO) atau surat jalan serta memeriksa kondisi fisik bebas kerusakan.`,`Menata barang pada rak/area gudang per kategori, mencatat barang masuk dan keluar secara akurat pada sistem/buku stok, serta melakukan stock opname berkala.`,`Menyiapkan, mengambil (picking), dan mengemas (packing) barang sesuai dokumen pesanan serta melakukan pengecekan ganda sebelum pemuatan ke armada pengiriman.`,`Mengoperasikan dan merawat mesin produksi sesuai SOP, menjalankan inspeksi Quality Control produk jadi, melampaui target produksi harian/mingguan 95%, serta menerapkan K3 dengan catatan nol kecelakaan kerja.`],en:[`Received and verified supplier deliveries against Purchase Orders (PO) and delivery notes while inspecting physical condition.`,`Organized warehouse racking by category, logged inbound/outbound inventory accurately, and ran periodic physical st
